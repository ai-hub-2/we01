name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - cursor/migrate-web-project-to-cloudflare-pages-bb62
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        working-directory: apps/we-dev-next
        run: pnpm install --frozen-lockfile

      - name: Build Next app
        working-directory: apps/we-dev-next
        run: pnpm build
        env:
          BOLT_API_BASE: ${{ secrets.BOLT_API_BASE }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: we-dev-pages
          directory: apps/we-dev-next/.next
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
